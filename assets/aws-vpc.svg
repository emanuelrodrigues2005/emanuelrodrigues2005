<svg width="600" height="240" viewBox="0 0 600 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AWS two-VPC architecture with ALB, EC2, VPC peering, PostgreSQL and Redis">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#17344A" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="600" height="240" fill="#0B1E2E"/>
  <rect width="600" height="240" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="599" height="239" stroke="#24455E"/>

  <text x="24" y="32" font-family="'Courier New', monospace" font-size="16" letter-spacing="1.6" fill="#7DD3FC">AWS / TWO-VPC ARCHITECTURE</text>
  <text x="24" y="50" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.2" fill="#7A9CB3">ALB · EC2 · VPC PEERING · NAT</text>

  <rect x="30" y="78" width="270" height="118" rx="6" fill="#0F2A40" stroke="#2F6A8A"/>
  <text x="44" y="100" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1" fill="#8FB3C9">VPC APP / 10.0.0.0/16</text>
  <rect x="44" y="112" width="84" height="24" rx="3" fill="#102F47" stroke="#38BDF8"/>
  <text x="86" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#D8E8F2">ALB</text>
  <rect x="144" y="112" width="84" height="24" rx="3" fill="#102F47" stroke="#2F6A8A"/>
  <text x="186" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#D8E8F2">JUMP</text>
  <rect x="44" y="154" width="84" height="24" rx="3" fill="#102F47" stroke="#2F6A8A"/>
  <text x="86" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#D8E8F2">EC2-A</text>
  <rect x="144" y="154" width="84" height="24" rx="3" fill="#102F47" stroke="#2F6A8A"/>
  <text x="186" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#D8E8F2">EC2-B</text>

  <rect x="330" y="78" width="240" height="118" rx="6" fill="#0F2A40" stroke="#2F6A8A"/>
  <text x="344" y="100" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1" fill="#8FB3C9">VPC DATA / 10.1.0.0/16</text>
  <rect x="344" y="112" width="110" height="24" rx="3" fill="#102F47" stroke="#2F6A8A"/>
  <text x="399" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#D8E8F2">POSTGRESQL</text>
  <rect x="344" y="154" width="110" height="24" rx="3" fill="#102F47" stroke="#2F6A8A"/>
  <text x="399" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#D8E8F2">REDIS</text>

  <line x1="300" y1="137" x2="330" y2="137" stroke="#F59E0B" stroke-dasharray="3 3"/>
  <text x="315" y="70" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" letter-spacing="0.8" fill="#F59E0B">PEERING</text>

  <text x="24" y="212" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1" fill="#8FB3C9">PUBLIC APP SUBNETS · PRIVATE DATA SUBNETS</text>
  <text x="24" y="230" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1" fill="#5F849C">SECURITY GROUPS BY ROLE · LEAST PRIVILEGE</text>
