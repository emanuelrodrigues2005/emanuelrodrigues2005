<svg width="600" height="240" viewBox="0 0 600 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LED ELT pipeline with raw, profiling, staging, dimensional and analytics stages">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#17344A" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="600" height="240" fill="#0B1E2E"/>
  <rect width="600" height="240" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="599" height="239" stroke="#24455E"/>

  <text x="24" y="32" font-family="'Courier New', monospace" font-size="16" letter-spacing="1.6" fill="#7DD3FC">LED / ELT PIPELINE</text>
  <text x="24" y="50" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.2" fill="#7A9CB3">DUCKDB · SQL · MAKE</text>

  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="0.7" fill="#D8E8F2" text-anchor="middle">
    <rect x="30" y="104" width="90" height="34" rx="4" fill="#0F2A40" stroke="#2F6A8A"/>
    <text x="75" y="125">RAW</text>
    <rect x="140" y="104" width="90" height="34" rx="4" fill="#0F2A40" stroke="#2F6A8A"/>
    <text x="185" y="125">PROFILE</text>
    <rect x="250" y="104" width="90" height="34" rx="4" fill="#0F2A40" stroke="#2F6A8A"/>
    <text x="295" y="125">STAGING</text>
    <rect x="360" y="104" width="90" height="34" rx="4" fill="#0F2A40" stroke="#2F6A8A"/>
    <text x="405" y="125">DIM</text>
    <rect x="470" y="104" width="90" height="34" rx="4" fill="#0F2A40" stroke="#38BDF8"/>
    <text x="515" y="125">ANALYTICS</text>
  </g>

  <g stroke="#2F6A8A">
    <line x1="120" y1="121" x2="140" y2="121"/>
    <line x1="230" y1="121" x2="250" y2="121"/>
    <line x1="340" y1="121" x2="360" y2="121"/>
    <line x1="450" y1="121" x2="470" y2="121"/>
  </g>
  <g fill="#2F6A8A">
    <path d="M138 117l5 4-5 4z"/>
    <path d="M248 117l5 4-5 4z"/>
    <path d="M358 117l5 4-5 4z"/>
    <path d="M468 117l5 4-5 4z"/>
  </g>

  <text x="24" y="188" font-family="'Courier New', monospace" font-size="18" letter-spacing="1.2" fill="#F59E0B">2.96M ROWS</text>
  <text x="24" y="210" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1" fill="#8FB3C9">21 QUALITY CHECKS</text>
  <text x="24" y="226" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1" fill="#5F849C">RAW → STAGING RECONCILIATION</text>

  <text x="576" y="188" text-anchor="end" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1" fill="#8FB3C9">STAR SCHEMA</text>
  <text x="576" y="210" text-anchor="end" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.1" fill="#5F849C">MAKE ORCHESTRATION</text>
</svg>
